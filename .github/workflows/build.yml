name: build

on:
  push:
    branches: [ "main" ]
    # A tag builds exactly as main does and additionally publishes a release.
    # BUILD_ID is the commit hash, so the firmware a tag produces is identical
    # to the one already built from that commit on main.
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      ignore_cache:
        description: 'Skip restoring cache from previous builds'
        required: false
        default: false
        type: boolean

jobs:
  prepare:
    runs-on: self-hosted
    timeout-minutes: 5
    outputs:
      uid: ${{ steps.uid_step.outputs.userid }}
      gid: ${{ steps.uid_step.outputs.groupid }}
    steps:
      - name: Get User/Group ID
        id: uid_step
        run: |
          echo "userid=$(id -u)" >> "$GITHUB_OUTPUT"
          echo "groupid=$(id -g)" >> "$GITHUB_OUTPUT"

  firmware:
    name: STM32U031C8Ux firmware
    runs-on: self-hosted
    needs:
      - prepare
    timeout-minutes: 10
    permissions:
      # only needed by the release step below, which runs on tags alone
      contents: write
    container:
      image: ciserver.ci:5000/${{ github.repository_id }}:stm32cubeide-1.19.0_25607_20250703_0907_amd64
      credentials:
          username: ${{ secrets.CI_CACHE_REGISTRY_LOGIN }}
          password: ${{ secrets.CI_CACHE_REGISTRY_PASSWORD }}
      options: --user "${{ needs.prepare.outputs.uid }}:${{ needs.prepare.outputs.gid }}"
    env:
      TARGET: AIOT
    steps:
      - uses: actions/checkout@v5

      - name: Determine Version
        id: rev
        run: |
          if [ "${{ github.ref_type }}" = tag ]; then
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            printf 'version=%.8s\n' "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi

      # locate user home per passwd file, as referenced by some tools
      - name: Locate User Home
        id: home
        run: |
          echo "path=$(getent passwd "$(id -u)" | cut -d: -f6)" >> "$GITHUB_OUTPUT"

      - name: Fetch cache from server
        if: ${{ !inputs.ignore_cache }}
        uses: tespkg/actions-cache/restore@v1
        with:
          endpoint: ciserver.ci
          port: 9000
          insecure: true
          accessKey: ${{ secrets.CI_CACHE_MINIO_ACCESS }}
          secretKey: ${{ secrets.CI_CACHE_MINIO_SECRET }}
          bucket: cicache
          use-fallback: false
          key: ${{ github.repository }}/main
          path: |
            ${{ steps.home.outputs.path }}/.stm32cubemx

      # regenerate code and confirm tree is still clean (catch changes to AIOT.ioc)
      - name: Re-generate Code (STM32CubeMX)
        id: stm32cubemx
        env:
          # "project path" names the parent directory and STM32CubeMX appends
          # the project name to it, so it is given one holding a symlink of
          # that name back to the checkout. Generation has to land there:
          # only an in-place run merges the USER CODE sections back in.
          #
          # The .ioc is named relative to the checkout, which is where the step
          # runs. github.workspace is the path on the runner rather than the one
          # the container sees, and naming that one would send STM32CubeMX
          # looking for a file that does not exist there.
          CUBEMX_SCRIPT: |
            config load ${{ env.TARGET }}.ioc
            project path /tmp/cubemx
            project generate
            exit
          CUBEMX_TIMEOUT: 60
        run: |
          mkdir -p /tmp/cubemx
          ln -sfnv "$PWD" /tmp/cubemx/${{ env.TARGET }}
          printf '%s' "$CUBEMX_SCRIPT" > /tmp/verify.cubemx
          headless-cubemx.sh /tmp/verify.cubemx
          # STM32CubeMX always writes an IAR project and stamps the .ioc with
          # that toolchain. Undo only that, then require everything else to be
          # unchanged. Leaving it would also make tools/build_id.sh stamp the
          # build dirty.
          git checkout -- ${{ env.TARGET }}.ioc .mxproject
          rm -rf EWARM
          # -A stages untracked files too, so a peripheral that was added to
          # the model but never committed is caught as well.
          git add -A
          git diff --cached --exit-code

      # if cubemx timed out, publish its screenshot as CI artifact
      - name: Publish CubeMX Timeout Error
        if: failure() && steps.stm32cubemx.conclusion == 'failure' && hashFiles('timeout.png') != ''
        uses: actions/upload-artifact@v7
        with:
          name: cubemx-timeout
          path: timeout.png
          archive: false
          if-no-files-found: error

      - name: Update cache on the server (build may have failed)
        if: ${{ !cancelled() }}
        uses: tespkg/actions-cache/save@v1
        with:
          endpoint: ciserver.ci
          port: 9000
          insecure: true
          accessKey: ${{ secrets.CI_CACHE_MINIO_ACCESS }}
          secretKey: ${{ secrets.CI_CACHE_MINIO_SECRET }}
          bucket: cicache
          use-fallback: false
          key: ${{ github.repository }}/main
          path: |
            ${{ steps.home.outputs.path }}/.stm32cubemx

      # Headless CDT build of the Release configuration, the same one the IDE
      # builds. It runs the .cproject pre-build step, so build_id.h is
      # generated inside the container from the mounted checkout, which is
      # where ${ProjDirPath} resolves to. The .hex and .bin come from the
      # configuration's output converters, and it prints the size itself.
      - name: Compile, Link, Generate hex and bin
        run: |
          headless-build.sh -data /tmp/ws -import . -build ${{ env.TARGET }}/Debug
          headless-build.sh -data /tmp/ws -import . -build ${{ env.TARGET }}/Release

      - name: Generate SBoM
        run: |
          # Regenerating in place modifies a tracked file, which tools/build_id.sh
          # would report as a dirty tree. This is intentional as the sbom file
          # includes format placeholders. Hide the file from workspace.
          git update-index --skip-worktree sbom_cdx.json
          # update placeholders and missing fields in hand-written SBoM:
          # - git hash (added by git archive automatically)
          # - timestamp (added by git archive automatically, updated from CI)
          # - serial number (uuid, only added from CI)
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          SERIAL="urn:uuid:$(cat /proc/sys/kernel/random/uuid)"
          # version is tag for releases, commit hash otherwise
          if [ "${{ github.ref_type }}" = tag ]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="${{ github.sha }}"
          fi
          jq --arg ts "$TIMESTAMP" \
             --arg serial "$SERIAL" \
             --arg sha "${{ github.sha }}" \
             --arg version "$VERSION" \
             '.serialNumber = $serial |
              .metadata.timestamp = $ts |
              .metadata.component.version = $version |
              .metadata.component.purl = "pkg:github/SolidRun/ss-aiot-mcu@\($sha)"' \
              sbom_cdx.json > sbom_cdx.json.gen
              mv sbom_cdx.json.gen sbom_cdx.json
          # TODO: consider dynamic generation by code scanning

      - name: Generate Bundle
        id: bundle
        env:
          FILES: >-
            Debug/*.elf Debug/*.hex Debug/*.bin Debug/*.map
            Release/*.elf Release/*.hex Release/*.bin Release/*.map
            LICENSE.txt THIRD-PARTY-NOTICES.txt
            sbom_cdx.json
        run: |
          BUNDLE=${{ env.TARGET }}-firmware-${{ steps.rev.outputs.version }}
          mkdir -p "$BUNDLE"
          cp --parents $FILES "$BUNDLE/"
          zip -r "$BUNDLE.zip" "$BUNDLE"
          rm -rf "$BUNDLE"
          echo "bundle=$BUNDLE.zip" >> "$GITHUB_OUTPUT"

      # publish bundle as CI artifact
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.bundle.outputs.bundle }}
          path: ${{ steps.bundle.outputs.bundle }}
          archive: false
          if-no-files-found: error

      # publish bundle and sbom as Release artifacts
      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ steps.bundle.outputs.bundle }}
            sbom_cdx.json
          fail_on_unmatched_files: true
